<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <!-- description y theme-color los inyecta Expo desde app.json; React Navigation pisa el
         title en runtime con el de App.tsx, así que los dos tienen que coincidir. -->
    <title>Calculadora MIDE Edenor: cuántos kWh te da tu recarga</title>
    <meta
      name="keywords"
      content="calculadora MIDE, simulador MIDE, MIDE Edenor, medidor prepago Edenor, recarga MIDE, kWh, consumo eléctrico, tarifa Edenor, cuadro tarifario ENRE, T1-R"
    />
    <link rel="canonical" href="https://simulador-mide.vercel.app/" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:site_name" content="Consumo MIDE" />
    <meta property="og:url" content="https://simulador-mide.vercel.app/" />
    <meta property="og:title" content="Calculadora MIDE Edenor: cuántos kWh te da tu recarga" />
    <meta
      property="og:description"
      content="Simulá cuántos kWh te acredita una recarga del medidor prepago MIDE de Edenor, según tu consumo acumulado del mes y el cuadro tarifario del ENRE."
    />
    <meta property="og:image" content="https://simulador-mide.vercel.app/og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Calculadora MIDE Edenor",
        "url": "https://simulador-mide.vercel.app/",
        "description": "Simulador de recargas del medidor prepago MIDE de Edenor: calcula cuántos kWh acredita un monto según los tramos del cuadro tarifario del ENRE.",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Web, Android",
        "inLanguage": "es-AR",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "ARS" }
      }
    </script>

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>
      Calculadora MIDE de Edenor: simulá cuántos kWh te da una recarga del medidor prepago.
      Necesitás habilitar JavaScript para usarla.
    </noscript>
    <div id="root"></div>
  </body>
</html>
